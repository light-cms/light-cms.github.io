name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  artifact-metadata: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jdx/mise:debian
    steps:
      - name: checkout code
        uses: actions/checkout@main
        with:
          submodules: recursive
      - name: cache mise
        uses: actions/cache@main
        with:
          path: ${{ github.workspace }}/.local/share/mise
          key: ${{ runner.os }}-mise
          restore-keys: |
            ${{ runner.os }}-mise

      - name: Install dependencies & building
        run: |
          mise deps
          mise install
          mise run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@main

      - name: index now (bing)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          sitemap=./dist/sitemap.xml
          if [ ! -f "$sitemap" ]; then
            echo "::error::missing $sitemap"
            exit 1
          fi
          key="$(printf '%s' "${INDEXNOW_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::INDEXNOW_KEY secret is unset or blank"
            exit 1
          fi
          if ! printf '%s' "$key" | grep -Eq '^[A-Za-z0-9-]{8,128}$'; then
            echo "::error::INDEXNOW_KEY must be 8-128 chars of [A-Za-z0-9-]"
            exit 1
          fi
          host="pratyay360.github.io"
          urls=()
          while IFS= read -r url; do
            urls+=("$url")
          done < <(grep -o '<loc>[^<]*</loc>' "$sitemap" | sed -E 's#</?loc>##g')
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::no <loc> entries found in $sitemap"
            exit 1
          fi
          list=""
          for url in "${urls[@]}"; do
            url="${url//\\/\\\\}"
            url="${url//\"/\\\"}"
            [ -z "$list" ] || list+=$',\n'
            list+="    \"${url}\""
          done
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          printf '{\n  "host": "%s",\n  "key": "%s",\n  "keyLocation": "https://%s/%s.txt",\n  "urlList": [\n%s\n  ]\n}\n' \
            "$host" "$key" "$host" "$key" "$list" > "$payload"
          echo "Submitting ${#urls[@]} URLs to IndexNow"
          code="$(curl -sS --retry 3 --retry-delay 2 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @"$payload" \
            -o /dev/null -w '%{http_code}' \
            https://www.bing.com/indexnow)" || code="curl-failed"
          echo "IndexNow response: ${code}"
          case "$code" in
            200|202) ;;
            *)
              echo "::error::IndexNow submission failed (HTTP ${code})"
              exit 1
              ;;
          esac
