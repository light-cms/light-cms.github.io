# Translations use Zola's filename suffix convention:
# content/blog/post.md -> content/blog/post.<code>.md.
# UI strings are read from i18n/<code>.toml, falling back to the theme's files.
# A language must be listed here before Crowdin downloads its translations, and
# each key must match the Crowdin %locale% code used in crowdin.yml.

[languages.de]
