base_url = "https://blogs.lightcms.me"
# base_url = "http://localhost:8000"
title = "LightCMS - Git based CMS for static sites"
description = "LightCMS is a Git based CMS for static sites"
theme = "duckquill"

default_language = "en"

compile_sass = true

build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

[[taxonomies]]
name = "tags"

[search]
in_search_index = false

[markdown]
render_emoji = true
[markdown.highlighting]
light_theme = "solarized-light"
dark_theme = "solarized-dark"
style = "class"
error_on_missing_language = true


[extra]
brand = "LightCMS Journal"
accent_color = "#983d25"
accent_color_dark = "#e28b65"
styles = ["css/style.css"]
source_url = "https://github.com/light-cms/lightcms"
favicon = "favicon.png"

# GoatCounter analytics; the theme only loads count.js when this table exists.
[extra.goatcounter]
user = "lightcms-docs"

[extra.nav]
links = [
	{ url = "@/blog/_index.md", name = "Blog" },
	{ url = "@/comparison/_index.md", name = "Comparisons" },
	{ url = "@/gallery/_index.md", name = "Gallery" },
	{ url = "@/about.md", name = "About" }
]
show_theme_switcher = true
#
[extra.footer]
# Links used in the footer.
# Same as the nav ones.
links = [
	{ url = "@/blog/_index.md", name = "Blog" },
	{ url = "@/comparison/_index.md", name = "Comparisons" },
	{ url = "@/gallery/_index.md", name = "Gallery" },
	{ url = "@/about.md", name = "About" }
]
