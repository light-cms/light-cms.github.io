# The URL the site will be built for
base_url = "https://blogs.lightcms.me"

title = "LightCMS"
description = "LightCMS is a Git-backed CMS for static sites: a visual Markdown editor with AI drafting, voice-to-text, and newsletters. Content stays in your repository."

compile_sass = true

build_search_index = true

generate_feeds = true
feed_filenames = ["atom.xml"]

[[taxonomies]]
name = "tags"


[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
# Put all your custom variables here
twitter_username = "LightCms5"
bluesky_username = "lightcms.bsky.social"
source_repo = "https://github.com/light-cms/lightcms"
