project_id: "945769"
api_token_env: "CROWDIN_PERSONAL_TOKEN"
base_path: "."
base_url: "https://api.crowdin.com"
preserve_hierarchy: true

export_languages:
  - de
  - es-ES
  - fr
  - pt-BR
  - ru
  - zh-CN

files:
  - source: "/content/**/*.md"
    translation: "/%original_path%/%file_name%.%locale%.%file_extension%"
    ignore:
      - "/content/**/*.*.md"
    languages_mapping:
      locale:
        de: "de"
        es-ES: "es"
        fr: "fr"
        ru: "ru"
        zh-CN: "zh-Hans"
        pt-BR: "pt-BR"
