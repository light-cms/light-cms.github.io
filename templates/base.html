<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if current_path == "/" %}{{ config.title }}{% else %}{% block title %}{{ config.title }}{% endblock title %} | {{ config.title }}{% endif %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}" />
  <link rel="stylesheet" href="{{ get_url(path="css/style.css") }}" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ get_url(path="@/_index.md") }}">{{ config.title }}</a>
      <span class="links">
        <a href="{{ get_url(path="@/_index.md") }}" {% if current_path == "/" %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ get_url(path="@/blog/_index.md") }}" {% if "/blog" in current_path %}aria-current="page"{% endif %}>Blog</a>
        <a href="{{ get_url(path="@/about.md") }}" {% if current_path == "/about/" %}aria-current="page"{% endif %}>About</a>
      </span>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <p>Built with <a href="https://www.getzola.org/">Zola</a>. Edit <code>content/</code> and <code>templates/</code> to make it yours.</p>
  </footer>
</body>
</html>
