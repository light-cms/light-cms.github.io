<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="msvalidate.01" content="C348576BB92261CC55029F04F308DB94" />
  <meta name="robots" content="{% block robots %}index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1{% endblock robots %}" />
  <meta name="author" content="LightCMS" />
  <meta name="theme-color" content="#fdfcfa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#14141a" media="(prefers-color-scheme: dark)" />
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}" />
  <link rel="canonical" href="{{ config.base_url }}{{ current_path }}" />
  <link rel="icon" href="{{ get_url(path="favicon.svg") }}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ get_url(path="og-image.png") }}" />
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path="atom.xml") }}" />
  <link rel="sitemap" type="application/xml" title="Sitemap" href="{{ get_url(path="sitemap.xml") }}" />
  <link rel="stylesheet" href="{{ get_url(path="css/style.css") }}" />

  <meta property="og:site_name" content="{{ config.title }}" />
  <meta property="og:type" content="{% block og_type %}website{% endblock og_type %}" />
  <meta property="og:title" content="{% block og_title %}{{ config.title }}{% endblock og_title %}" />
  <meta property="og:description" content="{% block og_description %}{{ config.description }}{% endblock og_description %}" />
  <meta property="og:url" content="{{ config.base_url }}{{ current_path }}" />
  <meta property="og:image" content="{% block og_image %}{{ get_url(path="og-image.png") }}{% endblock og_image %}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="675" />
  <meta property="og:image:alt" content="{% block og_image_alt %}{{ config.title }}{% endblock og_image_alt %}" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% block tw_title %}{{ config.title }}{% endblock tw_title %}" />
  <meta name="twitter:description" content="{% block tw_description %}{{ config.description }}{% endblock tw_description %}" />
  <meta name="twitter:image" content="{% block tw_image %}{{ get_url(path="og-image.png") }}{% endblock tw_image %}" />

  <script type="application/ld+json">
  {% block jsonld %}{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": {{ config.title | json_encode() | safe }},
    "url": {{ config.base_url | json_encode() | safe }},
    "description": {{ config.description | json_encode() | safe }},
    "inLanguage": "en",
    "publisher": {
      "@type": "Organization",
      "name": "LightCMS",
      "url": "https://www.lightcms.me/",
      "sameAs": ["https://www.lightcms.me/", "https://github.com/light-cms", "https://www.lightcms.me/docs"]
    }
  }{% endblock jsonld %}
  </script>
  <script type="text/javascript">
      ((c,l,a,r,i,t,y)=> {
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "z03gl17xi6");
  </script>
  {% block jsonld_extra %}{% endblock jsonld_extra %}
  {% block head_extra %}{% endblock head_extra %}
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="{{ get_url(path="@/_index.md") }}">
        <svg class="logo-mark" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true" focusable="false">
          <defs><linearGradient id="lgm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#5b21b6"/></linearGradient></defs>
          <rect width="64" height="64" rx="15" fill="url(#lgm)"/>
          <path d="M21 16 v24 a7 7 0 0 0 7 7 h13" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="44" cy="21" r="5.5" fill="#fff" fill-opacity=".92"/>
        </svg>
        <span>{{ config.title }}</span>
      </a>
      <span class="links">
        <a href="{{ get_url(path="@/_index.md") }}" {% if current_path == "/" %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ get_url(path="@/blog/_index.md") }}" {% if "/blog" in current_path %}aria-current="page"{% endif %}>Blog</a>
        <a href="{{ get_url(path="@/comparison/_index.md") }}" {% if "/comparison" in current_path %}aria-current="page"{% endif %}>Comparisons</a>
        <a href="{{ get_url(path="@/about.md") }}" {% if current_path == "/about/" %}aria-current="page"{% endif %}>About</a>
        <a class="nav-cta" href="https://www.lightcms.me/" rel="noopener">Get LightCMS</a>
      </span>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock content %}
  </main>

  <footer class="site-footer">
    <p>Written with <a href="https://www.lightcms.me/">LightCMS</a>, a Git-backed CMS for static sites. <a href="https://www.lightcms.me/docs">Docs</a> · <a href="https://github.com/light-cms">GitHub</a> · <a href="{{ get_url(path="atom.xml") }}">RSS</a></p>
    <p>Built with <a href="https://www.getzola.org/">Zola</a></p>
  </footer>

</body>
</html>
